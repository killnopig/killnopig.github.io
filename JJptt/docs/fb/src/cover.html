<!doctype html>
<!-- Source of docs/fb/fb-cover.png (1640×624, Facebook page cover).
     Keep text and phones inside the centre 1110 px (x 265–1375): phones crop the sides to 16:9.
     Render: node docs/fb/src/render.js -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "NotoTC"; font-weight: 500; src: url(fonts/noto-sans-tc-chinese-traditional-500-normal.woff2); }
  @font-face { font-family: "NotoTC"; font-weight: 900; src: url(fonts/noto-sans-tc-chinese-traditional-900-normal.woff2); }
  @font-face { font-family: "NotoLat"; font-weight: 500; src: url(fonts/noto-sans-tc-latin-500-normal.woff2); }
  @font-face { font-family: "NotoLat"; font-weight: 900; src: url(fonts/noto-sans-tc-latin-900-normal.woff2); }
  :root { --bg: #151a14; --green: #9ad25a; --text: #f2f2ee; --dim: #a7ad9f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1640px; height: 624px; overflow: hidden; }
  body { position: relative; background: radial-gradient(ellipse 60% 90% at 70% 60%, #24301d 0%, var(--bg) 70%), var(--bg);
         font-family: "NotoLat", "NotoTC", "WenQuanYi Zen Hei", sans-serif; color: var(--text); }
  .grid { position: absolute; inset: 0; opacity: .07;
          background-image: linear-gradient(#9ad25a 1px, transparent 1px), linear-gradient(90deg, #9ad25a 1px, transparent 1px);
          background-size: 32px 32px; mask-image: linear-gradient(90deg, #000 0%, transparent 30%, transparent 70%, #000 100%); }
  .text { position: absolute; left: 300px; top: 118px; }
  .pill { display: inline-block; background: var(--green); color: #14200c; font-weight: 900; font-size: 24px; padding: 8px 22px; border-radius: 999px; }
  h1 { margin-top: 26px; font-weight: 900; font-size: 64px; line-height: 1.18; letter-spacing: .01em; }
  h1 em { font-style: normal; color: var(--green); }
  .sub { margin-top: 24px; font-weight: 500; font-size: 26px; line-height: 1.55; color: var(--dim); }
  .phone { position: absolute; width: 250px; height: 556px; border-radius: 36px; background: #0b0d0a; padding: 9px;
           box-shadow: 0 0 0 2px #3a4234, 0 30px 60px rgba(0,0,0,.6); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 28px; display: block; }
  .p1 { left: 890px; top: 120px; transform: rotate(-6deg); }
  .p2 { left: 1095px; top: 70px; transform: rotate(5deg); }
</style>
</head>
<body>
<div class="grid"></div>
<div class="text">
  <span class="pill">JJptt · 免費 PTT 用戶端</span>
  <h1>上 PTT，<br>順手抓出<em>帶風向的</em></h1>
  <p class="sub">秒推、同網段、機房 IP 自動標出來<br>Android App ＋ Chrome 擴充・開源・無廣告</p>
</div>
<div class="phone p1"><img src="../../images/app-fact.png"></div>
<div class="phone p2"><img src="../../images/app-pushes.png"></div>
</body>
</html>
