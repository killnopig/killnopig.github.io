d.children[1].textContent=(errs.length?errs.slice(0,5).join('；'):'沒有收到錯誤訊息（可能是網路太慢或舊的快取）')+'。版本 '+window.APP_VERSION+'，'+navigator.userAgent.replace(/^.*?\(/,'(').slice(0,80);
var b=document.createElement('button');b.textContent='重新載入（略過舊快取）';b.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:15px';
b.onclick=function(){location.replace(location.pathname+'?r='+Date.now())};d.appendChild(b);document.body.appendChild(d)},8000)})();

<style>
:root{
  --bg:#faf6f1;--card:#fff;--tx:#23180f;--mu:#75675a;--ln:#ece3d9;--soft:#f5ede4;
  --ac:#e07b12;--ac-tx:#a85400;--ac-soft:#fdebd6;--act:#2a1606;--warn:#be123c;--on-warn:#fff;--warn-soft:#fde7ec;--bad:#b42318;
  --r:16px;color-scheme:light;--c1:#2f6fd0;--c3:#7c3aed;--c4:#0e7490;
}
/* 色系（data-pal）：暖色系是預設；冷色系、賽博朋克另外蓋上去。淺色／深色（data-theme）照舊 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100c;--card:#1f1813;--tx:#f2e9e1;--mu:#a8988a;--ln:#33281f;--soft:#271e17;
  --ac:#ffa040;--ac-tx:#ffa040;--ac-soft:#3a2614;--act:#1a0d06;--warn:#ff6b8a;--on-warn:#1a0d06;--warn-soft:#3a1520;--bad:#ff7b72;color-scheme:dark;--c1:#7aa2ff;--c3:#b69cff;--c4:#4fd1e8}}
:root[data-theme="dark"]{
  --bg:#15100c;--card:#1f1813;--tx:#f2e9e1;--mu:#a8988a;--ln:#33281f;--soft:#271e17;
  --ac:#ffa040;--ac-tx:#ffa040;--ac-soft:#3a2614;--act:#1a0d06;--warn:#ff6b8a;--on-warn:#1a0d06;--warn-soft:#3a1520;--bad:#ff7b72;color-scheme:dark;--c1:#7aa2ff;--c3:#b69cff;--c4:#4fd1e8}
:root[data-pal="cool"]{
  --bg:#f4f7fb;--card:#fff;--tx:#142033;--mu:#5f6b7d;--ln:#dfe5ee;--soft:#eaf0f7;
  --ac:#1f5fbf;--ac-tx:#1f5fbf;--ac-soft:#e1ecfb;--act:#fff;--warn:#b45309;--on-warn:#fff;--warn-soft:#fdf1e3;--bad:#b42318;--c1:#0d9488;--c3:#7c3aed;--c4:#0e7490}
@media (prefers-color-scheme:dark){:root[data-pal="cool"]:not([data-theme="light"]){
  --bg:#0d121a;--card:#151c27;--tx:#e6ecf5;--mu:#8f9bb0;--ln:#243044;--soft:#1b2433;
  --ac:#6aa8ff;--ac-tx:#6aa8ff;--ac-soft:#172a45;--act:#06101f;--warn:#f0a14a;--on-warn:#1a0f00;--warn-soft:#33240f;--bad:#f2766b;--c1:#2dd4bf;--c3:#b69cff;--c4:#4fd1e8}}
:root[data-pal="cool"][data-theme="dark"]{
  --bg:#0d121a;--card:#151c27;--tx:#e6ecf5;--mu:#8f9bb0;--ln:#243044;--soft:#1b2433;
  --ac:#6aa8ff;--ac-tx:#6aa8ff;--ac-soft:#172a45;--act:#06101f;--warn:#f0a14a;--on-warn:#1a0f00;--warn-soft:#33240f;--bad:#f2766b;--c1:#2dd4bf;--c3:#b69cff;--c4:#4fd1e8}
/* 賽博朋克：固定深色底、霓虹粉紅＋青藍 */
:root[data-pal="cyber"]{
  --bg:#0b0716;--card:#150e26;--tx:#f1eaff;--mu:#9b8fbf;--ln:#2d2150;--soft:#1d1433;
  --ac:#ff2bd6;--ac-tx:#ff2bd6;--ac-soft:#3a1240;--act:#12001a;--warn:#ffd400;--on-warn:#1a1400;--warn-soft:#332b00;--bad:#ff4d6d;color-scheme:dark;--c1:#00e5ff;--c3:#b388ff;--c4:#7cff6b}
[data-pal="cyber"] button.pri{box-shadow:0 0 14px rgba(255,43,214,.45)}
[data-pal="cyber"] .card{border-color:#3a2a66;box-shadow:0 0 0 1px rgba(0,229,255,.06)}
[data-pal="cyber"] .ring .c b,[data-pal="cyber"] h1{text-shadow:0 0 10px rgba(0,229,255,.55)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:baseline;gap:8px;margin:3px 2px 7px}
header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.2px}
.mu{color:var(--mu)}.small{font-size:13px}.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.pane{display:none}.pane.on{display:block}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
input[type=range]{padding:0;background:transparent;accent-color:var(--ac);height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5 input{padding:8px 6px;text-align:center}
.grid5 label{margin:8px 0 3px;text-align:center;font-size:12px;line-height:1.25}
.grid5 label small{display:block;font-size:11px}
details:not(:first-child){margin-top:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--soft);color:var(--tx);font-weight:600}
button.pri{background:var(--ac);color:var(--act)}
button.ghost{background:transparent;border:1px solid var(--ln)}
button.link{background:none;padding:6px 2px;color:var(--ac-tx);font-weight:600}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--ln)}
button.full{width:100%;margin-top:12px}
button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:8px}.row.between{justify-content:space-between}.grow{flex:1;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;background:transparent;border:1px solid var(--ln);color:var(--mu)}
.pills button.on{background:var(--ac-soft);border-color:transparent;color:var(--ac-tx);font-weight:650}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 0;border-radius:10px;background:transparent;color:var(--mu);font-weight:550;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--mu);border-bottom:1.6px solid var(--mu);transform:rotate(45deg);margin:0 4px 4px;transition:transform .15s;flex-shrink:0}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* 今日 */
.hero{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.ring .c b{font-size:28px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .3s}
.bar.warn i{background:var(--warn)}
.metric+.metric{margin-top:10px}
.metric .row{font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:15px;font-size:17px;border-radius:14px}
.cta svg.i{width:22px;height:22px}
.cta-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:16px}.cta-row .cta{margin-top:0;white-space:nowrap;min-width:0}.cta-row .ghost.cta{padding:15px 8px;border:1.5px solid var(--ac);color:var(--ac-tx)}
.cta-row.sm{margin-top:10px}.cta-row.sm .cta{padding:10px 8px;font-size:15px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln);cursor:pointer}
.list .it:first-child{border-top:0}
.list .pts{font-weight:700;font-size:17px;white-space:nowrap}
.thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.daygrp{border-top:1px solid var(--ln);padding:10px 0}
.daygrp summary{font-size:14px}
.empty{color:var(--mu);text-align:center;padding:14px 0;font-size:14px}
.notice{background:var(--warn-soft);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.notice.ok{background:var(--ac-soft)}
.kv{display:grid;grid-template-columns:1fr auto auto auto;row-gap:6px;font-size:14px;background:var(--soft);border-radius:12px;padding:12px 14px;align-items:baseline}
.kv .k{color:var(--mu)}.kv .i{text-align:right;font-weight:650}.kv .f{font-weight:650;min-width:1.4em}.kv .u{color:var(--mu);padding-left:4px;min-width:2.4em}
.kv .sub{grid-column:1/-1;font-size:12px;color:var(--mu);margin:-6px 0 2px}
/* 面板 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:none;overscroll-behavior:contain}
.sheet.on,.sheet-bg.on{display:block}
.grab{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h b{font-size:18px}
.item-card .name{font-size:17px;font-weight:650;border:0;background:transparent;padding:0;border-radius:0}
.item-card .big{font-size:26px;font-weight:700;color:var(--ac-tx);white-space:nowrap}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;padding:8px 0;font-size:14px;font-weight:500}
.spin{width:22px;height:22px;border:2.5px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px}
.photobox{position:relative;margin-top:12px}
.photobox .preview{display:block;height:120px;max-height:none;margin:0}
.photo-ov{position:absolute;inset:0;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600}
.photo-ov[hidden]{display:none}
.photo-ov .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.photo-ov .link{color:#fff;text-decoration:underline;font-size:15px}
.photobox .photo-x{position:absolute;top:6px;right:6px;width:32px;height:32px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;display:flex;align-items:center;justify-content:center}
.foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px;margin-top:6px}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:transparent;border-radius:0;padding:8px 0 10px;color:var(--mu);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--ac-tx)}
nav.tabs button[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90vw;text-align:center}
#toast.bad{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:480px;max-height:90vh;overflow:auto;margin:0}
.legal p{margin:0 0 8px}
/* MetaPulse app：狀態列與手勢列不要蓋到內容 */
.native body{padding-top:max(env(safe-area-inset-top,0px),32px)}
.native body::before{content:"";position:fixed;top:0;left:0;right:0;height:max(env(safe-area-inset-top,0px),32px);background:#141917;z-index:45;pointer-events:none}
.native nav.tabs{padding-bottom:max(env(safe-area-inset-bottom,0px),12px)}
.native main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* 極簡：每個選項、按鈕、摘要都只佔一行；說明收在 ⓘ */
button,label,select{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills button{flex:0 0 auto}
details>summary,details>summary *{white-space:nowrap}
details>summary>*,details>summary .grow>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
details.tip{margin-top:6px}
details.tip>summary{display:inline-flex;justify-content:flex-start;gap:4px;font-size:12px;color:var(--mu);font-weight:500}
details.tip>summary::after{display:none}
details.tip>div{font-size:12px;color:var(--mu);line-height:1.65;margin-top:4px;white-space:normal}
details.tip>div *{white-space:normal}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.jbox{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:0 10px 10px 0;transition:background .15s}
.jbox.lifted{position:relative;z-index:5;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.25);transition:none}
.jbox.drop{background:var(--ac-soft);outline:2px dashed var(--ac);outline-offset:2px}
.mergebar{position:sticky;bottom:0;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 -4px 18px rgba(0,0,0,.15)}
.undobar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.updbadge{margin-left:auto;align-self:center;background:var(--ac);color:var(--act);border:0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;animation:updpulse 1.6s ease-in-out infinite}
.updbadge.ok{background:var(--soft);color:var(--mu);font-weight:500;animation:none}
@keyframes updpulse{0%,100%{opacity:1}50%{opacity:.45}}
.card.med{padding:11px 14px}.card.med .daygrp{padding:6px 0}
.list.meals .it{padding:4px 0;gap:8px}.list.meals .thumb{width:28px;height:28px;border-radius:7px}.list.meals .pts{font-size:15px}
.card.tight{padding:12px 14px;line-height:1.4}.tight button.full{margin-top:8px}.tight .list .it{padding:7px 0}.tight details.tip{margin-top:0}.tight .cta-row{margin-top:10px}.tight .cta{padding:12px}.tight .empty{padding:8px 0}.tight .hero{gap:12px}
@media (max-width:360px){.hero{grid-template-columns:100px 1fr}.ring,.ring svg{width:100px;height:100px}.grid5{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
  <header><h1>MetaPulse</h1><span id="ver" class="mu" style="font-size:11px"></span><button id="upd" class="updbadge ok" type="button">✓ 最新</button></header>
  <div id="sync" class="mu tiny" style="margin:-5px 2px 6px;cursor:pointer"></div>

  <section id="p-today" class="pane on"></section>
  <section id="p-log" class="pane"></section>
  <section id="p-chart" class="pane"></section>
  <section id="p-set" class="pane"></section>
</main>

<nav class="tabs"><div class="in">
  <button data-t="today" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>飲食運動</button>
